<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MOVE AI - Clinical Angle Demo Showcase</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pico-main/css/pico.min.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
        }
        body, h1, h2, h3, p, button, a, nav {
            font-family: 'Space Mono', monospace;
        }
        #container {
            display: flex;
            height: calc(100vh - 65px);
            border: 4px solid #000;
        }
        #leftSide {
            flex: 6;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 4px solid #000;
            overflow: hidden;
        }
        #rightSide {
            flex: 4;
            background-color: rgba(5, 150, 105, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: rgba(5, 150, 105, 0.1);
            border: 4px solid #000;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
        .stat-card {
            background: rgba(255,255,255,0.85);
            border: 2px solid #000;
            padding: 14px;
            box-shadow: 2px 2px 0px #000;
        }
        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #059669;
            color: #10b981;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
</head>
<body>
    <nav>
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" style="height: 38px;">
            <span class="pixel-font">MOVE AI</span>
            <span style="font-size: 0.75rem; background: #059669; color: white; padding: 2px 6px; border: 1px solid #000;">CLINICAL ANGLE DEMO</span>
        </div>
        <div>
            <a href="/demo_pizza" class="pixel-font" style="color: var(--primary); text-decoration: none; margin-left: 1rem;">pizza demo</a>
            <a href="/pizzagame" class="pixel-font" style="color: var(--primary); text-decoration: none; margin-left: 1rem;">games</a>
            <a href="http://localhost:5173" class="pixel-font" style="color: var(--primary); text-decoration: none; margin-left: 1rem;">landing page</a>
        </div>
    </nav>

    <div id="container">
        <div id="leftSide">
            <div class="live-badge">
                <span class="pulse-dot"></span>
                <span>INTELLIREHABDS GONIOMETRY ANALYSIS</span>
            </div>
            <video id="videoFeed" src="{{ url_for('static', filename='videos/movement-demo.mp4') }}" autoplay loop muted playsinline></video>
        </div>

        <div id="rightSide">
            <div class="stat-card">
                <div style="font-size: 0.75rem; color: #555; text-transform: uppercase;">Exercise</div>
                <h3 style="margin: 4px 0 0 0; color: #047857;">Left Bicep Curl & Elbow AROM</h3>
            </div>

            <div class="stat-card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 0.75rem; color: #555;">CURRENT ANGLE</div>
                    <div id="angleDisplay" style="font-size: 2.2rem; font-weight: bold; color: #111;">160°</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.75rem; color: #555;">TARGET ROM</div>
                    <div style="font-size: 1.2rem; font-weight: bold; color: #059669;">35° - 165°</div>
                </div>
            </div>

            <div class="stat-card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 0.75rem; color: #555;">REPS COMPLETED</div>
                    <div id="repsDisplay" style="font-size: 2.2rem; font-weight: bold; color: #111;">0</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.75rem; color: #555;">STAGE</div>
                    <div id="stageDisplay" style="font-size: 1.2rem; font-weight: bold; color: #059669;">REST</div>
                </div>
            </div>

            <div class="stat-card" style="background: rgba(5,150,105,0.15); border-color: #059669;">
                <div style="font-size: 0.75rem; color: #047857; font-weight: bold;">SAUDI ATTIRE OCCLUSION ENGINE</div>
                <div style="font-size: 0.85rem; margin-top: 4px;">Active loose fabric compensation: <strong>88% Confidence</strong></div>
            </div>

            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.06); padding: 8px; border: 2px solid #000;">
                <span style="font-size: 0.75rem; font-weight: bold;">SPEED:</span>
                <button onclick="setSpeed(0.5)" id="spd05" class="pixel-font" style="padding: 4px 8px; font-size: 0.7rem; border: 2px solid #000; background: #fff; cursor: pointer;">0.5x</button>
                <button onclick="setSpeed(0.75)" id="spd075" class="pixel-font" style="padding: 4px 8px; font-size: 0.7rem; border: 2px solid #000; background: #fff; cursor: pointer;">0.75x</button>
                <button onclick="setSpeed(1.0)" id="spd10" class="pixel-font" style="padding: 4px 8px; font-size: 0.7rem; border: 2px solid #000; background: #059669; color: white; cursor: pointer;">1.0x</button>
            </div>

            <button onclick="toggleAudioGuide()" id="audioBtn" style="background-color: #059669; border: 3px solid #000; font-family: 'Space Mono', monospace; font-size: 0.9rem; padding: 10px; cursor: pointer; color: white; width: 100%;">
                🔊 استمع للتوجيه الصوتي (سيلما AI)
            </button>
            <audio id="audioCoach" src="{{ url_for('static', filename='audio/cheese.wav') }}" preload="auto"></audio>
        </div>
    </div>

    <script>
        var video = document.getElementById('videoFeed');
        var angleDisplay = document.getElementById('angleDisplay');
        var repsDisplay = document.getElementById('repsDisplay');
        var stageDisplay = document.getElementById('stageDisplay');

        function setSpeed(rate) {
            video.playbackRate = rate;
            ['spd05', 'spd075', 'spd10'].forEach(function(id) {
                var btn = document.getElementById(id);
                btn.style.backgroundColor = '#fff';
                btn.style.color = '#000';
            });
            var activeId = rate === 0.5 ? 'spd05' : (rate === 0.75 ? 'spd075' : 'spd10');
            var activeBtn = document.getElementById(activeId);
            if (activeBtn) {
                activeBtn.style.backgroundColor = '#059669';
                activeBtn.style.color = '#fff';
            }
        }

        video.addEventListener('timeupdate', function() {
            var t = video.currentTime % 14.29;
            var ang, stageText, stageColor, reps;

            if (t < 4.2) {
                var p = t / 4.2;
                ang = Math.round(168 + 7 * Math.sin(p * Math.PI));
                stageText = "READY / EXTENDED";
                stageColor = "#4b5563";
                reps = 0;
            } else if (t < 6.4) {
                var p = (t - 4.2) / 2.2;
                var ease = 0.5 - 0.5 * Math.cos(p * Math.PI);
                ang = Math.round(172 - 148 * ease);
                stageText = "CURLING UP";
                stageColor = "#059669";
                reps = 0;
            } else if (t < 7.0) {
                ang = 24;
                stageText = "PEAK FLEXION (ROM 100%)";
                stageColor = "#d97706";
                reps = 0;
            } else if (t < 8.6) {
                var p = (t - 7.0) / 1.6;
                var ease = 0.5 - 0.5 * Math.cos(p * Math.PI);
                ang = Math.round(24 + 144 * ease);
                stageText = "CONTROLLED LOWERING";
                stageColor = "#2563eb";
                reps = 0;
            } else if (t < 10.4) {
                ang = Math.round(168 + 6 * Math.sin((t - 8.6) * Math.PI));
                stageText = "REP 1 COMPLETE - REST";
                stageColor = "#059669";
                reps = 1;
            } else if (t < 12.4) {
                var p = (t - 10.4) / 2.0;
                var ease = 0.5 - 0.5 * Math.cos(p * Math.PI);
                ang = Math.round(174 - 150 * ease);
                stageText = "CURLING UP";
                stageColor = "#059669";
                reps = 1;
            } else if (t < 12.8) {
                ang = 24;
                stageText = "PEAK FLEXION (ROM 100%)";
                stageColor = "#d97706";
                reps = 1;
            } else {
                var p = Math.min((t - 12.8) / 1.4, 1.0);
                var ease = 0.5 - 0.5 * Math.cos(p * Math.PI);
                ang = Math.round(24 + 141 * ease);
                var isDone = p > 0.8;
                stageText = isDone ? "REP 2 COMPLETE - READY" : "CONTROLLED LOWERING";
                stageColor = isDone ? "#059669" : "#2563eb";
                reps = isDone ? 2 : 1;
            }

            angleDisplay.innerText = ang + "°";
            repsDisplay.innerText = reps;
            stageDisplay.innerText = stageText;
            stageDisplay.style.color = stageColor;
        });

        function toggleAudioGuide() {
            var audio = document.getElementById('audioCoach');
            var btn = document.getElementById('audioBtn');
            if (audio.paused) {
                audio.currentTime = 0;
                audio.play();
                btn.innerText = "⏸️ إيقاف الصوت (Stop Audio)";
                btn.style.backgroundColor = "#d97706";
            } else {
                audio.pause();
                btn.innerText = "🔊 استمع للتوجيه الصوتي (سيلما AI)";
                btn.style.backgroundColor = "#059669";
            }
        }
    </script>
</body>
</html>
